name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
      # This fork targets Koikatu / CharaStudio. The other game projects in the
      # solution are inherited from upstream and do not build as-is on master
      # (Core.Sideloader.HotReload.cs references Studio types without the guards
      # the EC / AI / HS2 builds need), so build the KK target only.
      - run: dotnet build src/KK_Sideloader/KK_Sideloader.csproj --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}_${{ github.sha }}
          path: bin/**/*.dll
